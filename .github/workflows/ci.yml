name: ci

# Build-only gate: install, lint, typecheck, build. No deployment, and no
# browser tests — the Playwright suite needs a browser download and a served
# build, so it is run locally before a deployment instead (see README).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / typecheck / build
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-next-

      # `postinstall` runs `fumadocs-mdx`, which generates the content index
      # under `.source/`. Every later step depends on it.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Fails if any `<Screenshot id="…" />` in the content references an id
      # that is not in the manifest, or if the manifest shape has drifted from
      # what the Excel generator can parse. Both are silent-ish at build time
      # (an unknown id renders an error block rather than throwing), so they
      # get an explicit gate here.
      - name: Verify screenshot manifest
        run: bun run screenshots:index
