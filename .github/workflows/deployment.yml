name: Deploy
run-name: Deploy → ${{ inputs.environment }}

# Manual only. `vercel.json` sets `git.deploymentEnabled: false`, so a push
# never deploys — this workflow is the single path to a deployed site.
#
# Required repository configuration (see README ▸ Deployment):
#   Secrets      — VERCEL_TOKEN
#   Variables    — VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   Environments — Staging, Production
#
# `type: environment` lists the repository's own environments rather than a
# hard-coded list, so the dropdown cannot drift from what exists. Matches
# solarlayout's platform-deployment.yml.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: environment

concurrency:
  # Never cancel a deployment in flight — a half-applied Vercel deploy is
  # worse than a queued one.
  group: deployment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    env:
      # Vercel target slugs are lowercase. `staging` is a CUSTOM Vercel
      # environment on this team, not Vercel's built-in `preview` — the same
      # convention every app in solarlayout's platform-deployment.yml uses, so
      # `vercel pull --environment=staging` resolves that environment's own
      # variables. Anything other than Production maps to it.
      VERCEL_TARGET: ${{ inputs.environment == 'Production' && 'production' || 'staging' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Defensive: abort before touching Vercel if the target resolved to
      # anything unexpected, rather than deploying to the wrong environment.
      - name: Validate inputs
        run: |
          if [ "$VERCEL_TARGET" != "production" ] && [ "$VERCEL_TARGET" != "staging" ]; then
            echo "::error::VERCEL_TARGET resolved to '$VERCEL_TARGET' — expected 'production' or 'staging'"
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID is not set. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_PROJECT_ID is not set. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "OK VERCEL_TARGET=$VERCEL_TARGET"

      # `vercel pull` fails with a single generic line — "Could not retrieve
      # Project Settings" — whether the token is scoped to the wrong account,
      # the project id belongs to another team, or the project does not exist.
      # These two read-only calls separate those cases before the failure, so a
      # bad setup names itself instead of needing a second debugging round.
      # Neither can fail the job; the real gate is `vercel pull` below.
      - name: Diagnose Vercel access
        continue-on-error: true
        run: |
          echo "── Token scope ─────────────────────────────────────────────"
          vercel whoami --token=${{ secrets.VERCEL_TOKEN }} || \
            echo "::warning::vercel whoami failed — the token is invalid or revoked."
          echo "── Teams this token can see ────────────────────────────────"
          echo "Looking for VERCEL_ORG_ID=$VERCEL_ORG_ID"
          vercel teams ls --token=${{ secrets.VERCEL_TOKEN }} || \
            echo "::warning::vercel teams ls failed — the token may be scoped to a personal account rather than a team."
          echo "── Projects visible in that scope ──────────────────────────"
          echo "Looking for VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID"
          vercel project ls --token=${{ secrets.VERCEL_TOKEN }} || \
            echo "::warning::vercel project ls failed — the token cannot list projects in this scope."

      # Gate before acting: prove the site builds locally before asking Vercel
      # to build and publish it, so a broken build fails here rather than
      # halfway through a deploy.
      - name: Build locally as a gate
        run: bun run build

      - name: Pull Vercel environment
        run: |
          if ! vercel pull --yes --environment=$VERCEL_TARGET --token=${{ secrets.VERCEL_TOKEN }}; then
            echo "::error::vercel pull failed. Check the 'Diagnose Vercel access' step above:"
            echo "::error::(1) if whoami named a personal account, re-create the token scoped to the team that owns the project;"
            echo "::error::(2) if the team list does not contain $VERCEL_ORG_ID, the token belongs to a different team;"
            echo "::error::(3) if the project list does not contain the project for $VERCEL_PROJECT_ID, the id is wrong or the project sits in another scope;"
            echo "::error::(4) if all three look right, confirm a custom environment named '$VERCEL_TARGET' exists on the project."
            exit 1
          fi

      - name: Build on Vercel
        run: vercel build --target=$VERCEL_TARGET --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --target=$VERCEL_TARGET --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      # Both values go through `env:` rather than being interpolated straight
      # into the script — DEPLOY_URL is command output, and shell-quoting it
      # here keeps the step safe regardless of what the CLI prints.
      - name: Summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          {
            echo "### Deployed to $TARGET_ENV"
            echo ""
            echo "$DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"
